<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><title>ALEXA UNO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#10131d;--panel:#1b2030;--muted:#aab2c5;--text:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252b43,#10131d 60%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}header{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0;letter-spacing:1px}.pill{background:#303950;border-radius:20px;padding:6px 10px;font-size:12px;color:#dce3f7}.table{margin:10px 14px;background:linear-gradient(140deg,#175a47,#123a38);border:5px solid #bd9b59;border-radius:28px;min-height:220px;padding:15px;box-shadow:0 12px 35px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.status{font-weight:700;text-align:center}.pile{display:flex;align-items:center;gap:16px}.card{width:66px;height:100px;border-radius:12px;border:3px solid #fff;box-shadow:0 4px 9px #0007;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;font-weight:900;color:white;text-shadow:1px 2px 2px #0007;transform:rotate(-4deg);background:#242833}.card:before{content:"";position:absolute;inset:8px 5px;border:2px solid #ffffffb0;border-radius:50%;transform:rotate(-25deg) scale(.85,1.18)}.face{font-size:27px;z-index:1;background:#ffffff25;border-radius:50%;padding:7px 3px;transform:rotate(4deg)}.red{background:#e83e50}.yellow{background:#f3c83f;color:#222;text-shadow:none}.green{background:#18a86b}.blue{background:#2879e8}.wild{background:conic-gradient(#e83e50 0 25%,#f3c83f 0 50%,#18a86b 0 75%,#2879e8 0)}.section{padding:8px 14px}.section h2{font-size:14px;color:#dce3f7;margin:4px 0 10px}.players{display:flex;gap:8px;overflow:auto}.player{background:var(--panel);border:1px solid #ffffff12;border-radius:13px;padding:10px;min-width:105px}.player strong{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player small{color:var(--muted)}.handwrap{margin:0 0 10px;padding:12px 0 18px;background:#181d2b;border-radius:18px 18px 0 0;overflow:hidden}.handhead{display:flex;justify-content:space-between;padding:0 14px 12px}.hand{display:flex;gap:0;overflow-x:auto;padding:5px 14px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}.hand .card{width:76px;height:116px;margin-right:-13px;transform:rotate(-2deg);cursor:pointer;scroll-snap-align:center;transition:transform .15s,margin .15s}.hand .card.selected{transform:translateY(-14px) rotate(0);margin-right:0;z-index:2;box-shadow:0 0 0 3px #fff,0 8px 18px #0008}.hand .face{font-size:29px}.actions{display:flex;gap:9px;padding:0 14px 20px}.btn{border:0;border-radius:13px;padding:13px 12px;font-weight:800;color:white;background:#5865f2;flex:1}.btn.secondary{background:#30384c}.btn:disabled{opacity:.4}.note{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 20px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:24px}.modal{background:#202638;border-radius:20px;padding:20px;width:100%;max-width:320px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors button{height:60px;border:0;border-radius:12px;color:#fff;font-weight:800}.colors .yellow{color:#222}
</style></head><body>
<header><h1>🎴 ALEXA UNO</h1><span class="pill" id="turnBadge">CONNECTING…</span></header>
<div class="table"><div class="status" id="status">Loading your game…</div><div class="pile"><div><small>TOP CARD</small><div id="topCard" class="card red"><span class="face">?</span></div></div><div><small>COLOR</small><div id="colorText" style="font-size:22px;font-weight:900">—</div></div></div><div id="direction" class="pill">↻ Clockwise</div></div>
<section class="section"><h2>PLAYERS</h2><div class="players" id="players"></div></section>
<div class="handwrap"><div class="handhead"><strong>YOUR HAND</strong><span class="pill" id="count">0 cards</span></div><div class="hand" id="hand"></div><div class="actions"><button class="btn secondary" id="draw">＋ Draw card</button><button class="btn" id="play" disabled>Play selected</button></div><div class="note" id="hint">Tap a card to select it. Swipe sideways to browse your hand.</div></div>
<div id="colorModal" class="overlay hidden"><div class="modal"><h2>Choose a color</h2><div class="colors"><button class="red" data-color="Red">🔴 Red</button><button class="yellow" data-color="Yellow">🟡 Yellow</button><button class="green" data-color="Green">🟢 Green</button><button class="blue" data-color="Blue">🔵 Blue</button></div></div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();if(tg?.themeParams?.bg_color)document.body.style.background=tg.themeParams.bg_color;
const params=new URLSearchParams(location.search), chatId=params.get('chat_id');let state=null,selected=null,pendingWild=null;
const $=id=>document.getElementById(id);
function colorClass(c){return ({Red:'red',Yellow:'yellow',Green:'green',Blue:'blue'})[c]||'wild'}
function glyph(v){return ({Skip:'⊘',Reverse:'⇄','+2':'+2','+4':'+4',Wild:'✦'})[v]||v}
function makeCard(c,idx,interactive=false){let el=document.createElement('button');el.type='button';el.className='card '+colorClass(c.color);el.setAttribute('aria-label',(c.color||'Wild')+' '+c.value);el.innerHTML='<span class="face">'+glyph(c.value)+'</span>';if(interactive){el.addEventListener('click',()=>{selected=idx;renderHand()});if(selected===idx)el.classList.add('selected')}else el.disabled=true;return el}
function renderHand(){const hand=$('hand');hand.innerHTML='';(state?.hand||[]).forEach((c,i)=>hand.appendChild(makeCard(c,i,true)));$('count').textContent=(state?.hand?.length||0)+' cards';$('play').disabled=selected===null||!state?.isTurn;$('draw').disabled=!state?.isTurn}
function render(){if(!state)return;$('status').textContent=state.message|| (state.isTurn?'Your turn — choose a card!':'Waiting for '+(state.currentPlayerName||'next player'));$('turnBadge').textContent=state.isTurn?'YOUR TURN':'WAITING';$('topCard').replaceWith(Object.assign(makeCard(state.topCard||{color:null,value:'?'},-1),{id:'topCard'}));$('colorText').textContent=state.currentColor||'Wild';$('direction').textContent=state.direction===-1?'↺ Counter-clockwise':'↻ Clockwise';const ps=$('players');ps.innerHTML='';(state.players||[]).forEach(p=>{let d=document.createElement('div');d.className='player';d.innerHTML='<strong></strong><small></small>';d.firstChild.textContent=p.name+(p.isTurn?' ▶':'');d.lastChild.textContent=p.cards+' cards';ps.appendChild(d)});renderHand()}
async function api(action,extra={}){if(!tg?.initData){$('hint').textContent='Open this game from inside Telegram to play.';return}try{const res=await fetch('/uno/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'tma '+tg.initData},body:JSON.stringify({chat_id:chatId,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error||'Game action failed');state=data;selected=null;render()}catch(e){$('hint').textContent=e.message}}
async function refresh(){if(!tg?.initData)return;try{const r=await fetch('/uno/api/state?chat_id='+encodeURIComponent(chatId),{headers:{'Authorization':'tma '+tg.initData}});const d=await r.json();if(r.ok){state=d;render()}else $('hint').textContent=d.error||'Could not load game'}catch(e){$('hint').textContent='Connection error — reopen the game.'}}
$('draw').onclick=()=>api('draw');$('play').onclick=()=>{if(selected===null)return;const card=state.hand[selected];if(card.color===null){pendingWild=selected;$('colorModal').classList.remove('hidden')}else api('play',{index:selected})};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{$('colorModal').classList.add('hidden');api('play',{index:pendingWild,color:b.dataset.color});pendingWild=null});refresh();setInterval(refresh,3500);
</script></body></html>
