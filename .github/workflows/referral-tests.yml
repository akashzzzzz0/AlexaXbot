name: Referral regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/referral-stars-premium]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aiogram==3.13.1" "SQLAlchemy>=2.0.0,<2.1" "aiosqlite>=0.20.0" "structlog>=24.0.0" "pydantic>=2.4.1,<2.10" "pydantic-settings>=2.4.0,<2.10" "python-dotenv>=1.0.0" "greenlet>=3.0.0" "redis>=5.0.0" "aiohttp>=3.9.0,<3.11" "httpx>=0.27.0"
      - name: Compile Python files
        run: python -m compileall -q bot tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
