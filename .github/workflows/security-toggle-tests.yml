name: Security toggle regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install aiogram sqlalchemy aiosqlite structlog
      - name: Run security service regression tests
        run: PYTHONPATH=. python tests/test_security_service.py -v
