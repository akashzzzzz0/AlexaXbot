name: Speed Type event checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile bot and tests
        run: python -m compileall -q bot tests scripts
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_speed_type_event.py' -v
