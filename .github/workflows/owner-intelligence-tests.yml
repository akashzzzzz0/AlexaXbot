name: Owner intelligence checks

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/handlers/owner_intelligence.py"
      - "bot/handlers/__init__.py"
      - "tests/test_owner_intelligence.py"
      - ".github/workflows/owner-intelligence-tests.yml"
  push:
    branches: [main]
    paths:
      - "bot/handlers/owner_intelligence.py"
      - "bot/handlers/__init__.py"
      - "tests/test_owner_intelligence.py"
      - ".github/workflows/owner-intelligence-tests.yml"

jobs:
  owner-intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile new owner intelligence module
        run: python -m compileall -q bot/handlers/owner_intelligence.py tests/test_owner_intelligence.py
      - name: Run owner intelligence request tests
        run: PYTHONPATH=. python -m pytest -q tests/test_owner_intelligence.py
