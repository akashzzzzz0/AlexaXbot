name: Owner emoji ID tests

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/handlers/sticker_id.py"
      - "tests/test_owner_emoji_id.py"
      - ".github/workflows/owner-emojiid-tests.yml"

jobs:
  owner-emojiid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile sticker utility
        run: python -m py_compile bot/handlers/sticker_id.py
      - name: Run isolated custom emoji tests
        run: python -m unittest discover -s tests -p "test_owner_emoji_id.py" -v
