name: Alexa AI chat regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/handlers/ai_chat.py"
      - "bot/services/ai_chat_provider.py"
      - "tests/test_ai_chat_*.py"
      - ".github/workflows/alexa-ai-tests.yml"
  push:
    branches: [main]
    paths:
      - "bot/handlers/ai_chat.py"
      - "bot/services/ai_chat_provider.py"
      - "tests/test_ai_chat_*.py"
      - ".github/workflows/alexa-ai-tests.yml"

permissions:
  contents: read

jobs:
  alexa-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Alexa AI chat regression tests
        run: python -m unittest discover -s tests -p 'test_ai_chat_*.py' -v
      - name: Compile changed Python modules
        run: python -m py_compile bot/handlers/ai_chat.py bot/services/ai_chat_provider.py
