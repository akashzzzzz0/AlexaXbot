name: Global maintenance checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/global-maintenance-silence]

jobs:
  maintenance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run maintenance middleware tests
        run: python -m unittest discover -s tests -p 'test_global_maintenance.py' -v
      - name: Compile Python modules
        run: python -m compileall -q bot tests
