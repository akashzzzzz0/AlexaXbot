name: World Arena checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/alexa-world-arena]

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "SQLAlchemy>=2.0,<2.1"
      - name: Run Arena logic tests
        run: python -m unittest discover -s tests -p 'test_arena_logic.py' -v
      - name: Run existing Alexa smoke check
        run: python scripts/smoke_check.py
