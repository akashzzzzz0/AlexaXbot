name: Group promotion verification checks

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/handlers/group_promotion.py"
      - "tests/test_group_promotion_verification.py"
      - ".github/workflows/group-promotion-verification.yml"

jobs:
  group-promotion-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile verification handler and tests
        run: python -m compileall -q bot/handlers/group_promotion.py tests/test_group_promotion_verification.py
      - name: Run group verification tests
        run: PYTHONPATH=. python -m pytest -q tests/test_group_promotion_verification.py
